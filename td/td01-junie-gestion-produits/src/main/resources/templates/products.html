<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">Products</h1>
            <div class="d-flex gap-2">
                <form class="d-flex" method="get" action="/products">
                    <input class="form-control form-control-sm me-2" type="search" placeholder="Rechercher par nom" aria-label="Search" name="q" th:value="${q}" />
                    <button class="btn btn-outline-secondary btn-sm" type="submit">Rechercher</button>
                </form>
                <a class="btn btn-primary" href="/products/new">Nouveau</a>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Prix</th>
                    <th>Quantité</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}">
                    <td th:text="${p.id}">1</td>
                    <td th:text="${p.name}">Name</td>
                    <td th:text="${p.price != null} ? T(java.lang.String).format('%.2f €', p.price.doubleValue()) : '—'">0.00 €</td>
                    <td th:text="${p.quantity}">0</td>
                    <td>
                        <a th:href="@{'/products/' + ${p.id} + '/edit'}" class="btn btn-sm btn-secondary">Modifier</a>
                        <form th:action="@{'/products/' + ${p.id} + '/delete'}" method="post" style="display:inline-block" onsubmit="return confirm('Supprimer ce produit ?');">
                            <button type="submit" class="btn btn-sm btn-danger">Supprimer</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
