<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New product</title>
</head>
<body>
<h1>New product</h1>
<form th:action="@{/products}" th:object="${product}" method="post">
    <label>Name: <input type="text" th:field="*{name}"/></label><br/>
    <label>Price: <input type="number" step="0.01" th:field="*{price}"/></label><br/>
    <label>Quantity: <input type="number" th:field="*{quantity}"/></label><br/>
    <button type="submit">Save</button>
</form>
</body>
</html>
