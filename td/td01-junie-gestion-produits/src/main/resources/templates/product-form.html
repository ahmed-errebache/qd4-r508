<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <h1 class="h4 mb-3">New product</h1>

    <form th:action="${product.id} == null ? @{/products} : @{/products/{id}(id=${product.id})}" th:object="${product}" method="post" class="needs-validation" novalidate>
        <div class="mb-3">
                <label class="form-label">Nom</label>
            <input type="text" th:field="*{name}" class="form-control" required />
                <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Prix</label>
                <input type="text" th:field="*{price}" class="form-control" required pattern="^\d+(?:[\.,]\d{1,2})?$" />
                <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                <div class="form-text">Entrez un nombre positif (ex: 19.90). Les virgules sont acceptées.</div>
            </div>

            <div class="mb-3">
                <label class="form-label">Quantité</label>
                <input type="number" th:field="*{quantity}" class="form-control" />
                <div class="text-danger" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Enregistrer</button>
                <a href="/products" class="btn btn-secondary">Retour</a>
            </div>
        </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
