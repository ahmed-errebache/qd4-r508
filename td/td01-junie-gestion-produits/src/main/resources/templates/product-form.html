<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <h1 class="h4 mb-3">New product</h1>

    <form th:action="${product.id} == null ? @{/products} : @{/products/{id}(id=${product.id})}" th:object="${product}" method="post" class="needs-validation" novalidate>
        <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
        <div class="mb-3">
                <label class="form-label">Nom</label>
            <input type="text" th:field="*{name}" class="form-control" required />
                <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Prix</label>
                <input type="text" th:field="*{price}" class="form-control" required pattern="^\d+(?:[\.,]\d{1,2})?$" />
                <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                <div class="form-text">Entrez un nombre positif (ex: 19.90). Les virgules sont acceptées.</div>
            </div>

            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                <ul>
                    <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
                </ul>
            </div>

            <div class="mb-3">
                <label class="form-label">Quantité</label>
                <input type="number" min="0" step="1" th:field="*{quantity}" class="form-control" />
                <div class="text-danger" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Enregistrer</button>
                <a href="/products" class="btn btn-secondary">Retour</a>
            </div>
        </form>

<script>
// Normalize price input: replace comma with dot, strip currency symbols, prevent negative
(function(){
  const form = document.currentScript ? document.currentScript.ownerDocument.querySelector('form') : document.querySelector('form');
  if (!form) return;
  form.addEventListener('submit', function(e){
        const priceInput = form.querySelector('input[name=price]');
        if (!priceInput) return;
        let v = priceInput.value.trim();
        // replace comma by dot
        v = v.replace(',', '.');
        // remove any non digit or dot characters (except leading minus)
        v = v.replace(/[^0-9.\-]/g, '');
        // remove extra dots
        const parts = v.split('.');
        if (parts.length>2) {
          v = parts.shift() + '.' + parts.join('');
        }
        // prevent negative
        if (v.startsWith('-')) v = v.substring(1);
        // if empty or not a number, prevent submit and focus
        if (v === '' || isNaN(Number(v))) {
          e.preventDefault();
          alert('Prix invalide. Entrez un nombre, ex: 19.90');
          priceInput.focus();
          return false;
        }
        // set normalized value
        priceInput.value = v;
  });
})();
</script>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
